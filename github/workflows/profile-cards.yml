name: Profile Summary Cards

on:
  schedule:
    - cron: "0 3 * * *"   # her gün 03:00 UTC
  workflow_dispatch:       # elle tetikleme

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release/v4
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        with:
          USERNAME: eryilmazyasin
          UTC_OFFSET: 3      # Türkiye saati

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push
